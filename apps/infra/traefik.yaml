apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.3.0
    helm:
      values: |
        deployment:
          replicas: 2
        service:
          spec:
            loadBalancerIP: PLACEHOLDER_INGRESS_IP
            externalTrafficPolicy: Local
        ingressClass:
          enabled: true
          isDefaultClass: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
