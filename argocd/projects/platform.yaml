apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform team services
  # Only this repo is approved as a source. Images are not sources, so which
  # images run is decided by releases/*.yaml and reviewed here.
  sourceRepos:
    - https://github.com/gerardrecinto/argocd-gitops
  # One namespace per environment, on the cluster registered under that name.
  destinations:
    - name: dev
      namespace: platform-dev
    - name: stage
      namespace: platform-stage
    - name: prod
      namespace: platform-prod
  clusterResourceWhitelist: []
  # Exactly what charts/service renders, nothing else.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
  orphanedResources:
    warn: true
  roles:
    - name: deployer
      description: Read everything, sync dev. Stage and prod are not theirs to sync.
      policies:
        - p, proj:platform:deployer, applications, get, platform/*, allow
        - p, proj:platform:deployer, applications, sync, platform/*-dev, allow
      groups:
        - PLACEHOLDER_PLATFORM_DEPLOYERS
    - name: release-manager
      description: Read everything, sync stage and prod. This is the prod approval.
      policies:
        - p, proj:platform:release-manager, applications, get, platform/*, allow
        - p, proj:platform:release-manager, applications, sync, platform/*-stage, allow
        - p, proj:platform:release-manager, applications, sync, platform/*-prod, allow
      groups:
        - PLACEHOLDER_PLATFORM_RELEASE_MANAGERS
