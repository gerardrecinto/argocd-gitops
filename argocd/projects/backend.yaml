apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backend
  namespace: argocd
spec:
  description: Backend team services
  # Only this repo is approved as a source. Images are not sources, so which
  # images run is decided by releases/*.yaml and reviewed here.
  sourceRepos:
    - https://github.com/gerardrecinto/argocd-gitops
  # One namespace per environment, on the cluster registered under that name.
  destinations:
    - name: dev
      namespace: backend-dev
    - name: stage
      namespace: backend-stage
    - name: prod
      namespace: backend-prod
  clusterResourceWhitelist: []
  # Exactly what charts/service renders, nothing else.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
  orphanedResources:
    warn: true
  roles:
    - name: deployer
      description: Read everything, sync dev. Stage and prod are not theirs to sync.
      policies:
        - p, proj:backend:deployer, applications, get, backend/*, allow
        - p, proj:backend:deployer, applications, sync, backend/*-dev, allow
      groups:
        - PLACEHOLDER_BACKEND_DEPLOYERS
    - name: release-manager
      description: Read everything, sync stage and prod. This is the prod approval.
      policies:
        - p, proj:backend:release-manager, applications, get, backend/*, allow
        - p, proj:backend:release-manager, applications, sync, backend/*-stage, allow
        - p, proj:backend:release-manager, applications, sync, backend/*-prod, allow
      groups:
        - PLACEHOLDER_BACKEND_RELEASE_MANAGERS
